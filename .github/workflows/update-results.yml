name: Poll Election Results

on:
  schedule:
    # Colorado keeps counting for days (cure / overseas ballots through ~Nov 12, canvass after).
    # Every 15 min through Nov 6, then hourly through the end of November (times are UTC).
    - cron: '*/15 * 4-6 11 *'
    - cron: '7 * 7-30 11 *'
  workflow_dispatch:

concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch official election returns
        run: python fetch_election_results.py

      - name: Commit and push if results changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json national_results.json
          if git diff --cached --quiet; then
            echo "No change in official results since last check."
          else
            git commit -m "Update official results [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
